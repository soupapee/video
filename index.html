<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidéo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <video
        id="video"
        autoplay
        playsinline
        disablePictureInPicture
        controlsList="nodownload nofullscreen noremoteplayback">
        <source src="Follow the red dot.        Warning jump scare sorry (online-video-cutter.com).mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("video");
        video.volume = 1; // volume max (valeur entre 0 et 1)

        // On tente de lancer la vidéo AVEC le son dès le chargement
        video.muted = false;
        video.play().catch(() => {
            // Si le navigateur bloque l'autoplay avec son,
            // on relance en muet pour que la vidéo démarre quand même
            video.muted = true;
            video.play();
        });

        // Dès que l'utilisateur clique n'importe où sur la page,
        // on force le son à s'activer (au cas où elle était en muet)
        document.addEventListener("click", () => {
            video.muted = false;
            video.volume = 1;
        }, { once: true });

        // Empêche la vidéo de s'arrêter
        video.addEventListener("pause", () => {
            video.play();
        });

        // Recommence automatiquement à la fin
        video.addEventListener("ended", () => {
            video.currentTime = 0;
            video.play();
        });
    </script>

</body>
</html>
